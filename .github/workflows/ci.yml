name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Copy fixture
        run: npm run check:copy

      - name: Build
        run: npm run build

      - name: Behavior regression
        run: npm run test:behavior
        env:
          BEHAVIOR_SKIP_BUILD: "1"
          PLAYWRIGHT_CHANNEL: chrome

  browsers:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Firefox and WebKit
        run: npx --yes playwright@1.65.0 install --with-deps firefox webkit

      - name: Build
        run: npm run build

      - name: Cross-browser smoke
        run: npm run test:browsers
        env:
          BROWSER_SKIP_BUILD: "1"
